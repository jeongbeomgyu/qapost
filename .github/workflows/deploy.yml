name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "feature" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/board-project-backend:latest ./onebyte/onebyte_backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/board-project-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build --no-cache --platform linux/amd64 \
            --build-arg VITE_API_URL=http://${{ secrets.EC2_IP }}:8080 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/board-project-frontend:latest ./onebyte/CodeForest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/board-project-frontend:latest

      - name: Copy Config Files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "onebyte/docker-compose.yml,onebyte/deploy-ec2.sh"
          target: "~/onebyte"
          strip_components: 1

      - name: Execute Deployment Script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/onebyte
            export VITE_API_URL=http://${{ secrets.EC2_IP }}:8080
            chmod +x deploy-ec2.sh
            ./deploy-ec2.sh