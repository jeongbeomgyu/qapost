<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>STOMP Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
<h2>STOMP 테스트</h2>
<button onclick="connect()">Connect</button>
<button onclick="subscribe()">Subscribe</button>
<button onclick="sendMessage()">Send</button>
<script>
    let client;

    const TOKEN = "Bearer eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJ1c2VyQUB0ZXN0LmNvbSIsIm5hbWUiOiLtmY3quLjrj5kiLCJuaWNrbmFtZSI6IuycoOyggEEiLCJ1c2VySWQiOjEsInJvbGVzIjoiUk9MRV9VU0VSIiwiaWF0IjoxNzY3MzQ4NjQwLCJleHAiOjE3NjczNTA0NDB9.MfI75agWtE4Nj5pCFeLlOKjTNZAlj_4vBnAkVsGRq9hcE8ZfVEN7ZwNBDIhggqtdj32Fa0BRfZp9eJyq7CNRKA";

    function connect() {
        client = new StompJs.Client({
            webSocketFactory: () => new SockJS("http://localhost:8080/ws-stomp"),
            connectHeaders: {
                Authorization: TOKEN
            },
            debug: (str) => console.log(str),
            onConnect: () => {
                console.log("✅ STOMP CONNECTED");
            },
            onStompError: (frame) => {
                console.error("❌ STOMP ERROR", frame);
            }
        });

        client.activate();
    }

    function subscribe() {
        client.subscribe("/sub/chat/room/1", message => {
            console.log("📩 받은 메시지:", message.body);
        });
    }

    function sendMessage() {
        client.publish({
            destination: "/pub/chat/message",
            body: JSON.stringify({
                roomId: 1,
                content: "stomp.js 테스트 메시지2"
            })
        });
    }
</script>
</body>
</html>
